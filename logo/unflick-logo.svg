<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED" />
      <stop offset="100%" style="stop-color:#DB2777" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="36" y="36" width="440" height="440" rx="96" ry="96" fill="url(#bg)" />

  <!-- Film perforations - left -->
  <rect x="68" y="80" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="68" y="118" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="68" y="156" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="68" y="194" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="68" y="232" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="68" y="270" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />

  <!-- Film perforations - right -->
  <rect x="420" y="80" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="420" y="118" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="420" y="156" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="420" y="194" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="420" y="232" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />
  <rect x="420" y="270" width="24" height="16" rx="4" fill="rgba(255,255,255,0.18)" />

  <!-- Play triangle - upper portion -->
  <polygon points="210,92 210,296 368,194" fill="white" opacity="0.95" />

  <!-- Text "unflick" inside the icon, bottom area -->
  <text x="256" y="420" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="82" font-weight="700" letter-spacing="-1">
    <tspan fill="rgba(255,255,255,0.5)">un</tspan><tspan fill="white">flick</tspan>
  </text>
</svg>
