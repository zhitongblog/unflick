# Smithery configuration for the unflick MCP server.
# https://smithery.ai/docs/build/project-config
#
# unflick is a native binary and this is a local stdio server: Smithery runs it
# on the user's own machine, so it launches the installed binary directly.
# Users must have unflick installed (https://unflick.app).
#
# Once `unflick-mcp` is published to npm, this can become
#   command: "npx", args: ["-y", "unflick-mcp"]
# which drops the PATH requirement.

startCommand:
  type: stdio
  # No configuration is required to start the server.
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |
    (config) => ({
      command: "unflick",
      args: ["--mcp"]
    })

build:
  # Nothing to compile — the server is the installed binary.
  dockerfile: null
