[package]
name = "unflick"
version = "0.14.0"
description = "A free, ad-free video player for humans and AI"
authors = ["xiangdong li"]
edition = "2021"
license = "MIT"
repository = "https://github.com/zhitongblog/unflick"
homepage = "https://unflick.app"
readme = "../README.md"

[lib]
name = "unflick_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "unflick"
path = "src/main.rs"

# ─── Track A part 2 — GUI self-test bridge ────────────────────────────
# Tauri decides at compile time whether the webview loads `frontendDist`
# (the built `dist/`) or `devUrl` (a vite server on :1420), and the switch
# is this feature: `tauri-macros` sets `dev = cfg!(not(feature =
# "custom-protocol"))`. Without it declared there was no way to compile a
# binary that serves its own frontend, so a `cargo build` GUI came up on
# about:blank unless `pnpm dev` happened to be running — which is exactly
# what `tests/gui_dev.rs` cannot depend on. Declaring it changes nothing
# for builds that do not ask for it.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs-next = "2"
raw-window-handle = "0.6"
# Cross-platform GL context creation. We embed mpv's render output into a
# native child surface (HWND / NSView / GtkWidget) and hand mpv a GL context
# created here. glutin abstracts WGL / NSOpenGLContext / GLX-EGL behind one
# API.
glutin = "0.32"
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
which = "7"
ureq = "2"
# Enumerating this machine's own addresses, for SSDP. The standard library
# has no way to list interfaces, and sending a multicast search from
# 0.0.0.0 lets the routing table pick one — which on any machine with a VM
# bridge, a container network or a VPN is reliably the wrong one.
if-addrs = "0.13"

[target.'cfg(unix)'.dependencies]
# `init_file_log` points stderr at the startup log so `unflick startup` has
# marks to read. Windows does it with SetStdHandle; the Unix equivalent is
# dup2, which needs libc. Already in Cargo.lock at this version via tauri,
# so promoting it to a direct dependency changes no build.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
# Track A part 2 — `dev capture` on Windows. ICoreWebView2::CapturePreview
# hands back PNG directly; PrintWindow would hand back a raw BGRA DIB with
# no encoder in this tree to turn it into anything, and would capture the
# same layer anyway (mpv draws on a separate top-level WS_POPUP). Both
# crates are already in Cargo.lock at these versions via tauri.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Cocoa bridge for the embedded NSView + click-through hit-test override.
# objc2 is the modern, safety-checked replacement for objc/cocoa.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread", "NSString", "NSValue", "NSData", "NSDictionary", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics"] }
core-foundation = "0.10"
core-graphics = "0.24"
# Track A part 2 — `dev capture` on macOS. WKWebView's own snapshot API,
# rather than a window grab: CGWindowListCreateImage needs the Screen
# Recording permission, which is a dialog no unattended agent can click.
# Both crates are already in Cargo.lock at these versions as transitive
# tauri dependencies, so promoting them to direct deps changes no build.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux uses raw_window_handle (already a workspace dep) to fish the
# X11 XID out of Tauri's WebviewWindow — no extra crates needed for
# the basic embed-via-XCreateSimpleWindow path.
#
# gtk is needed only to pump gtk_main_iteration during setup() — the
# X11 XID isn't allocated until gtk_widget_realize fires, which is an
# async event on the GTK main loop. Tauri's setup hook runs *before*
# the main loop starts, so we have to drive events ourselves between
# `window.show()` and bring_up_video_pipeline retries. Match the
# version Tauri 2.10 / webkit2gtk-4.1 already pulls in transitively
# so we don't double-link.
gtk = "0.18"
# Track A part 2 — `dev capture` on Linux. The webview's own snapshot,
# for the same reason as on the other two platforms: it means the same
# thing everywhere and needs nothing from the compositor. `cairo-rs/png`
# is what turns the returned surface into bytes; the feature only switches
# on cairo's own PNG entry points, which every cairo build has.
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }
