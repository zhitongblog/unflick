[package]
name = "unflick"
version = "0.6.0"
description = "A video player for humans and AI"
authors = []
edition = "2021"

[lib]
name = "unflick_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "unflick"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs-next = "2"
raw-window-handle = "0.6"
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
which = "7"
ureq = "2"
