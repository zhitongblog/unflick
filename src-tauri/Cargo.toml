[package]
name = "unflick"
version = "0.8.3"
description = "A video player for humans and AI"
authors = []
edition = "2021"

[lib]
name = "unflick_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "unflick"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs-next = "2"
raw-window-handle = "0.6"
# Cross-platform GL context creation. We embed mpv's render output into a
# native child surface (HWND / NSView / GtkWidget) and hand mpv a GL context
# created here. glutin abstracts WGL / NSOpenGLContext / GLX-EGL behind one
# API.
glutin = "0.32"
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
which = "7"
ureq = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
# Cocoa bridge for the embedded NSView + click-through hit-test override.
# objc2 is the modern, safety-checked replacement for objc/cocoa.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"] }
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux uses raw_window_handle (already a workspace dep) to fish the
# X11 XID out of Tauri's WebviewWindow — no extra crates needed for
# the basic embed-via-XCreateSimpleWindow path.
