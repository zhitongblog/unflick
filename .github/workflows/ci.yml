name: CI

# "Cross-platform" was a claim, not a fact: v0.10 shipped without a single
# line having run on macOS or Linux. This workflow is what turns it into a
# fact — every push builds and tests on all three.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGENTS.md is generated from CLAUDE.md; the two differ by four lines
      # out of five hundred. The last hand-maintained copy sat at its June
      # text while CLAUDE.md grew through v0.11-v0.14, so an agent reading it
      # was briefed on a project three versions gone. Nothing but a check
      # catches that — it is still a valid Markdown file when it is wrong.
      # Needs no toolchain, so it runs first and fails in seconds.
      - name: AGENTS.md is current with CLAUDE.md
        run: ./scripts/gen-agents.sh --check

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't hide whether the others are fine —
      # that's the whole reason this matrix exists.
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm earns its place by having caught something no test
        # could: C's plain `char` is unsigned there and signed everywhere else,
        # so a hardcoded `*const i8` in the mpv FFI made the tree fail to
        # compile on every ARM Linux machine — through four releases, because
        # no machine that had ever built it was one. A compile target is the
        # only thing that can assert "this builds elsewhere".
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      # The integration tests drive a real libmpv and build their fixture
      # media with ffmpeg. macOS and Linux take both from the system package
      # manager; Windows has no such package, so the same binaries the
      # installers bundle are downloaded instead.
      # Only the download here. Putting these beside the test binary has to
      # wait until after rust-cache has run — see the copy step below.
      - name: Install mpv + ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-windows-deps.sh --no-whisper

      - name: Install mpv + ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # macOS tests the libmpv the app ships, not Homebrew's: Homebrew's has
      # no libdvdnav, and testing against it is how "DVDs do not play on a
      # Mac" went unnoticed. No Homebrew mpv is installed at all, so a
      # missing build fails loudly instead of quietly falling back to one.
      # ffmpeg is still Homebrew's — the tests make their fixtures with it.
      - name: Install ffmpeg + libmpv build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg meson ninja nasm cmake pkgconf autoconf automake libtool

      # Keyed on the script: every pinned version lives in it, so a bump is a
      # rebuild and nothing else is. Only the runner's own architecture — the
      # tests run natively, and the release script builds both.
      - name: Cache the macOS libmpv
        if: runner.os == 'macOS'
        id: libmpv-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/mpv-dev/libmpv.2.dylib
          key: libmpv-mac-arm64-${{ hashFiles('scripts/build-mac-libmpv.sh') }}

      - name: Build the macOS libmpv
        if: runner.os == 'macOS' && steps.libmpv-cache.outputs.cache-hit != 'true'
        env:
          UNFLICK_LIBMPV_ARCHS: arm64
        run: ./scripts/build-mac-libmpv.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` embeds the built frontend at compile
      # time, so `dist/` has to exist before anything Rust-side compiles —
      # including the tests.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The tests spawn the built `unflick.exe`, which looks for these beside
      # itself — src-tauri/ alone would leave every test failing to load
      # libmpv.
      #
      # This cannot move up next to the download, which is where it used to
      # be and why Windows CI was red on every run from 2026-09-10 to -09-15.
      # `src-tauri/target` is one of rust-cache's cache paths, and on a
      # partial key match its restore pre-cleans that directory, keeping only
      # `build`, `.fingerprint` and `deps` in each profile dir — so it
      # deleted all three of these moments after they were copied in. The
      # reason it never recovered on its own: `cache-on-failure` defaults to
      # false, so a red run saves no new cache, the stale key stays, and the
      # next run mismatches and cleans again.
      - name: Put libmpv + ffmpeg beside the test binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/debug
          cp -r src-tauri/mpv-dev src-tauri/ffmpeg src-tauri/yt-dlp src-tauri/target/debug/
          # Assert rather than trust: this is the exact failure being fixed,
          # and without libmpv every integration test burns its 45s deadline
          # before saying so.
          test -f src-tauri/target/debug/mpv-dev/libmpv-2.dll
          test -f src-tauri/target/debug/ffmpeg/ffmpeg.exe
          echo "libmpv and ffmpeg are beside unflick.exe"

      # Same reason as the Windows copy above: after rust-cache, never before.
      - name: Put libmpv beside the test binary (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/target/debug/mpv-dev
          cp src-tauri/mpv-dev/libmpv.2.dylib src-tauri/target/debug/mpv-dev/
          test -f src-tauri/target/debug/mpv-dev/libmpv.2.dylib

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # Serialised: each integration test drives its own mpv instance, and
      # a CI runner has neither the cores nor the audio devices to run many
      # at once without flaking.
      - name: Integration tests
        working-directory: src-tauri
        # `disc` was never in this list, so its assertion that the shipped
        # libmpv plays DVDs was red on macOS with nobody to see it.
        run: cargo test --test playback --test understanding --test disc -- --test-threads=2

  build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libmpv-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Compile only. Bundling is left to the release process, which has to
      # juggle per-platform resources (see build-both.sh) and code signing.
      - name: Build
        working-directory: src-tauri
        run: cargo build --release
