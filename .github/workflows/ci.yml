name: CI

# "Cross-platform" was a claim, not a fact: v0.10 shipped without a single
# line having run on macOS or Linux. This workflow is what turns it into a
# fact — every push builds and tests on all three.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't hide whether the others are fine —
      # that's the whole reason this matrix exists.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # The integration tests drive a real libmpv and build their fixture
      # media with ffmpeg. On Windows both are vendored in the repo; the
      # other two get them from the system package manager.
      - name: Install mpv + ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev ffmpeg \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install mpv + ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` embeds the built frontend at compile
      # time, so `dist/` has to exist before anything Rust-side compiles —
      # including the tests.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # Serialised: each integration test drives its own mpv instance, and
      # a CI runner has neither the cores nor the audio devices to run many
      # at once without flaking.
      - name: Integration tests
        working-directory: src-tauri
        run: cargo test --test playback --test understanding -- --test-threads=2

  build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libmpv-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Compile only. Bundling is left to the release process, which has to
      # juggle per-platform resources (see build-both.sh) and code signing.
      - name: Build
        working-directory: src-tauri
        run: cargo build --release
