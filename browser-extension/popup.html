<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>unflick</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 12px;
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0d0d12;
        color: #ececf1;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .brand {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        background: linear-gradient(135deg, #a78bfa, #f472b6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.55);
      }
      .badge.online {
        background: rgba(16, 185, 129, 0.16);
        color: #6ee7b7;
      }
      .url {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 6px 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        margin-bottom: 10px;
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      button {
        flex: 1;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
      button.primary {
        background: linear-gradient(135deg, #7c3aed, #db2777);
      }
      button:hover {
        opacity: 0.9;
      }
      .status {
        margin-top: 8px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.45);
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="brand">unflick</span>
      <span id="daemon-state" class="badge">checking…</span>
    </div>
    <div id="current-url" class="url">—</div>
    <div class="actions">
      <button id="btn-play" class="primary">Play now</button>
      <button id="btn-queue">Add to queue</button>
    </div>
    <div id="feedback" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
